name: Windows tests, EXE and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  tests:
    name: Full Windows tests (shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-quick.txt
            requirements-ci.txt
      - name: Install test and runtime dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run all tests (no failure suppression)
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: python tools/run_ci_tests.py --shard-index "$env:TEST_SHARD" --shard-count 4
      - name: Retain test results, including failures and skips
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results-${{ matrix.shard }}
          path: |
            tmp/ci-tests/**/*.xml
            tmp/ci-tests/**/*.log
            tmp/ci-tests/**/summary.json
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build and verify portable EXE and Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-quick.txt
            requirements-ci.txt
      - name: Install build and runtime dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Select immutable build version
        id: version
        shell: pwsh
        run: |
          $version = "build-$env:GITHUB_RUN_NUMBER-$($env:GITHUB_SHA.Substring(0, 8))"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build portable EXE and verify relocated UI and worker
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: python tools/build_exe.py --version "$env:RELEASE_VERSION"
      - name: Build Setup and verify isolated install, upgrade and uninstall
        run: python tools/build_installer.py
      - name: Retain packaged UI verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe-smoke-results
          path: |
            tmp/release-smoke/
            tmp/installer-smoke/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload verified release files
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: |
            dist/SpectralSweep-*-windows-x64.zip
            dist/SpectralSweep-*-windows-x64.zip.sha256
            dist/SpectralSweep-*-windows-x64-Setup.exe
            dist/SpectralSweep-*-windows-x64-Setup.exe.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish only after tests and packaged smoke pass
    needs: [tests, build]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-portable
          path: release-files
      - name: Publish versioned Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          flags=(--prerelease --latest=false)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            flags=(--verify-tag --latest)
          fi
          cat > release-notes.md <<EOF
          Windows x64 build of commit ${GITHUB_SHA}.

          Recommended: download the Setup.exe for a per-user installation with shortcuts and uninstall support.
          Close SpectralSweep and its worker normally before installing or upgrading.
          Setup never closes acquisition processes, launches the app, or removes user settings/data.
          The ZIP is also available: extract it entirely, then run SpectralSweep.exe.
          Keep the worker EXE and _internal directory beside it. Python is included in both formats.

          Release gates: full Windows pytest suite (with reported prerequisite skips),
          EXE build, relocated nine-workspace UI audit and console-worker protocol check,
          isolated Setup install/upgrade/uninstall and installed-app smoke verification.
          Physical instruments, vendor drivers and licensed SDKs are not validated by CI.
          Install the required instrument software/drivers on the target PC.

          CI reports and screenshots: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          # Immutable assets: do not overwrite a previous release on a rerun.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Preserving its assets; inspect the existing release before retrying."
            exit 1
          fi
          gh release create "$tag" release-files/* --target "$GITHUB_SHA" \
            --title "SpectralSweep $tag" --notes-file release-notes.md "${flags[@]}"
